<form class="ui-confirm-settings" method="post" action="#settings"><input type="hidden" name="confirm.scope" value="global">
<fieldset class="ui-choice"><legend>edit</legend><span class="ui-choice-now">Don’t ask <span class="ui-pill" data-variant="tag">global</span></span><span class="ui-choice-opts"><label><input type="radio" name="confirm.edit" value="name">Type the name</label><label><input type="radio" name="confirm.edit" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.edit" value="never" checked>Don’t ask</label><label><input type="radio" name="confirm.edit" value="inherit">Use the default</label></span></fieldset>
<fieldset class="ui-choice"><legend>move</legend><span class="ui-choice-now">Ask y/N <span class="ui-pill" data-variant="tag">default</span></span><span class="ui-choice-opts"><label><input type="radio" name="confirm.move" value="name">Type the name</label><label><input type="radio" name="confirm.move" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.move" value="never">Don’t ask</label><label><input type="radio" name="confirm.move" value="inherit" checked>Use the default</label></span></fieldset>
<fieldset class="ui-choice"><legend>archive</legend><span class="ui-choice-now">Ask y/N <span class="ui-pill" data-variant="tag">default</span></span><span class="ui-choice-opts"><label><input type="radio" name="confirm.archive" value="name">Type the name</label><label><input type="radio" name="confirm.archive" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.archive" value="never">Don’t ask</label><label><input type="radio" name="confirm.archive" value="inherit" checked>Use the default</label></span></fieldset>
<fieldset class="ui-choice"><legend>delete</legend><span class="ui-choice-now">Type the name <span class="ui-pill" data-variant="tag">default</span></span><span class="ui-choice-opts"><label><input type="radio" name="confirm.delete" value="name">Type the name</label><label><input type="radio" name="confirm.delete" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.delete" value="never">Don’t ask</label><label><input type="radio" name="confirm.delete" value="inherit" checked>Use the default</label></span></fieldset>
<div class="ui-dialog-acts"><button class="ui-btn" type="submit" data-variant="primary">Save</button></div>
</form>
