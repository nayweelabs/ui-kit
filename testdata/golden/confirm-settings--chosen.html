<form class="ui-confirm-settings" method="post" action="#settings">
<fieldset class="ui-choice"><legend>create</legend><label><input type="radio" name="confirm.create" value="name">Type the name</label><label><input type="radio" name="confirm.create" value="yes-no" checked>Ask y/N</label><label><input type="radio" name="confirm.create" value="never">Don’t ask</label></fieldset>
<fieldset class="ui-choice"><legend>edit</legend><label><input type="radio" name="confirm.edit" value="name">Type the name</label><label><input type="radio" name="confirm.edit" value="yes-no" checked>Ask y/N</label><label><input type="radio" name="confirm.edit" value="never">Don’t ask</label></fieldset>
<fieldset class="ui-choice"><legend>move</legend><label><input type="radio" name="confirm.move" value="name">Type the name</label><label><input type="radio" name="confirm.move" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.move" value="never" checked>Don’t ask</label></fieldset>
<fieldset class="ui-choice"><legend>archive</legend><label><input type="radio" name="confirm.archive" value="name">Type the name</label><label><input type="radio" name="confirm.archive" value="yes-no" checked>Ask y/N</label><label><input type="radio" name="confirm.archive" value="never">Don’t ask</label></fieldset>
<fieldset class="ui-choice"><legend>delete</legend><label><input type="radio" name="confirm.delete" value="name" checked>Type the name</label><label><input type="radio" name="confirm.delete" value="yes-no">Ask y/N</label><label><input type="radio" name="confirm.delete" value="never">Don’t ask</label></fieldset>
<div class="ui-dialog-acts"><button class="ui-btn" type="submit" data-variant="primary">Save</button></div>
</form>
