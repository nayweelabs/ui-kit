--- # question/QST-PRODUCT-RECORD.yml
apiVersion: core/design/v2
kind: Question
metadata:
  id: QST-PRODUCT-RECORD
  title: Where the kit's Product record goes
spec:
  place:
    views:
      - context
  state:
    status: open
    severity: medium
  description: |
    The design should hold a `Product` record for ID `ui-kit` (G-PLAN-12, G-PLAN-13), but the e-designer build used here has no Product kind (its kinds: Adr, Block, Connection, Contradiction, Design, Flow, Group, Open, Question, Request, Risk, Suggestion, Suite). Add it when the kind ships; until then the ID lives in the product-family design and hubman's catalog.
--- # question/QST-WARN-SHADE.yml
apiVersion: core/design/v2
kind: Question
metadata:
  id: QST-WARN-SHADE
  title: Approve three light colours changed for contrast
spec:
  place:
    views:
      - structure
  state:
    status: open
    severity: medium
  description: |
    The article's light warn #A8670F, good-soft #E1F1E9 and bad-soft #F8E4DD left pill text under 4.5:1. The kit uses warn #975D0E, good-soft #EDF7F2 and bad-soft #F9E9E4 (tokens/tokens.json today), which pass; the dark theme is unchanged.
