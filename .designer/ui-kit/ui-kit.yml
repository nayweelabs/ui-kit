--- # flow/ask-before-a-change.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: ask-before-a-change
  title: A change asks before it is made
spec:
  entry:
    method: POST
    path: /{form-action}
  steps:
    - id: press
      at: CMP-BROWSER
      phase: caller
      label: The viewer presses a button drawn with Button.Ask
      note: The server resolved the action type's style with kit.ResolveConfirm (name, yes-no or never) before drawing it.
    - id: ask
      at: CMP-KITJS
      phase: pre
      label: kit.js stops the form in the capture phase and asks in the kit's dialog
      note: For a name, the confirm button works only once the name is typed exactly; Cancel or Escape sends nothing.
    - id: send
      at: CMP-GOAPP
      phase: pre
      label: The form arrives with confirm=yes or confirm=remember
    - id: check
      at: CMP-CONFIRM
      phase: execute
      label: kit.Confirmed(r) says whether the change was answered yes
      note: Without the yes, kit.RefuseUnconfirmed answers 428 "Nothing was changed", the web twin of a refusal without --yes.
    - id: change
      at: CMP-GOAPP
      phase: return
      label: The app makes the change; with remember it sets that type to never
--- # flow/load-a-lazy-section.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: load-a-lazy-section
  title: A slow section loads on its own
spec:
  entry:
    method: GET
    path: /{section-src}
  steps:
    - id: skeleton
      at: CMP-BROWSER
      phase: caller
      label: The shell arrived at once, with the section's skeleton
      note: The app gave kit.Section a Src, the address of the section's own HTML.
    - id: fetch
      at: CMP-KITJS
      phase: pre
      label: kit.js fetches every lazy section's data-ui-src, in parallel
    - id: read
      at: CMP-GOAPP
      phase: execute
      label: The app reads the section's sources
      note: It answers with the UI-Read-At header (RFC 3339), the time its sources were really read.
    - id: draw
      at: CMP-TEMPLATES
      phase: execute
      label: kit.HTML draws ui/section
    - id: place
      at: CMP-KITJS
      phase: return
      label: kit.js puts the section in its place and fills ui/read-at
      note: A fetch that fails shows the section's own error box with Retry; the rest of the page stays.
--- # flow/open-a-page.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: open-a-page
  title: A viewer opens a page of a Go app
spec:
  entry:
    method: GET
    path: /
  steps:
    - id: ask
      at: CMP-BROWSER
      phase: caller
      label: The viewer opens a page of the app
    - id: build
      at: CMP-GOAPP
      phase: pre
      label: The app's handler fills a kit.Page
      note: The server works out every value, tone, label, filter and order; the kit decides none of it.
    - id: execute
      at: CMP-TEMPLATES
      phase: execute
      label: ExecuteTemplate "ui/shell" on the set from kit.Templates()
    - id: draw
      at: CMP-PARTIALS
      phase: execute
      label: ui/shell draws the bar, header, sections and parts
      note: ui/assets in the head links /ui-kit/css/kit.css and /ui-kit/js/kit.js, without defer.
    - id: page
      at: CMP-BROWSER
      phase: return
      label: The whole page arrives, readable without JavaScript
    - id: files
      at: CMP-GOAPP
      phase: pre
      label: GET /ui-kit/css/kit.css and /ui-kit/js/kit.js
    - id: serve
      at: CMP-ASSETS
      phase: execute
      label: kit.Assets() serves the file from the embedded file system
      note: Only files under css/, fonts/ and js/ are served, with Cache-Control no-cache; anything else is 404.
    - id: css
      at: CMP-KITCSS
      phase: execute
      label: kit.css pulls in tokens.css and the fonts
    - id: script
      at: CMP-KITJS
      phase: return
      label: kit.js sets the theme before the first paint and wires the parts
--- # flow/regenerate-tokens.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: regenerate-tokens
  title: A token changes and tokens.css is written again
spec:
  entry:
    method: RUN
    path: /ui-kit-tokens
  steps:
    - id: edit
      at: CMP-DEV
      phase: caller
      label: The developer edits tokens/tokens.json and runs go run ./cmd/ui-kit-tokens
    - id: run
      at: CMP-TOKENSCMD
      phase: pre
      label: The command starts from the repository root
    - id: read
      at: CMP-TOKENSJSON
      phase: pre
      label: It reads tokens/tokens.json
    - id: parse
      at: CMP-TOKENSPKG
      phase: execute
      label: tokens.Parse checks every name is set and unique; Set.CSS() writes the properties
      note: Parse rejects unknown fields and empty values.
    - id: back
      at: CMP-TOKENSCMD
      phase: return
      label: The CSS comes back to the command
    - id: write
      at: CMP-TOKENSCSS
      phase: post
      label: css/tokens.css is replaced whole, through a temporary file and a rename
      note: CI runs the same command and fails a pull request whose tokens.css differs.
