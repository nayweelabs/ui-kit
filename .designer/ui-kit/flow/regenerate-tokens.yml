apiVersion: core/design/v2
kind: Flow
metadata:
  id: regenerate-tokens
  title: A token changes and tokens.css is written again
spec:
  entry:
    method: RUN
    path: /ui-kit-tokens
  steps:
    - id: edit
      at: CMP-DEV
      phase: caller
      label: The developer edits tokens/tokens.json and runs go run ./cmd/ui-kit-tokens
    - id: run
      at: CMP-TOKENSCMD
      phase: pre
      label: The command starts from the repository root
    - id: read
      at: CMP-TOKENSJSON
      phase: pre
      label: It reads tokens/tokens.json
    - id: parse
      at: CMP-TOKENSPKG
      phase: execute
      label: tokens.Parse checks every name is set and unique; Set.CSS() writes the properties
      note: Parse rejects unknown fields and empty values.
    - id: back
      at: CMP-TOKENSCMD
      phase: return
      label: The CSS comes back to the command
    - id: write
      at: CMP-TOKENSCSS
      phase: post
      label: css/tokens.css is replaced whole, through a temporary file and a rename
      note: CI runs the same command and fails a pull request whose tokens.css differs.
