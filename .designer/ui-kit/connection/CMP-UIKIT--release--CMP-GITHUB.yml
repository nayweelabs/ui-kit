apiVersion: core/design/v2
kind: Connection
metadata:
  id: CMP-UIKIT--release--CMP-GITHUB
spec:
  from: CMP-UIKIT
  to: CMP-GITHUB
  label: release
  sides: r-l
  badge:
    text: "6"
    description: |
      A merge to main makes a release tag from the commit types (`release.yml`, a tag and notes, no binaries); CI checks every pull request on a self-hosted Linux runner. The tag is the only version.
