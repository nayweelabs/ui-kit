apiVersion: core/design/v2
kind: Connection
metadata:
  id: CMP-UIKIT--data--CMP-BROWSER
spec:
  from: CMP-UIKIT
  to: CMP-BROWSER
  label: data
  sides: b-t
  badge:
    text: "5"
    description: |
      `kit.css`, `tokens.css`, the fonts and `kit.js` reach the viewer's browser through the app that serves them (`/ui-kit/…` from a Go app, or the Vite app's bundle). The kit adds no token or login of its own; the app decides who may see a page.
