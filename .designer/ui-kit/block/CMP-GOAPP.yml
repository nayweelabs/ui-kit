apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-GOAPP
  title: A Go web app
spec:
  place:
    views:
      - context
      - structure
    role: actor
  ui-design:
    look: soft
  caption: |
    imports `github.com/ElderlyGate/ui-kit`
    control-room today, at `v0.4.0`
  description: |
    Any Go web app of the org. In the org's checkouts, control-room is the one that imports the kit today (its go.mod requires `github.com/ElderlyGate/ui-kit v0.4.0`; it calls `kit.Assets`, `kit.Templates`, `kit.Funcs`, `kit.HTML`, `kit.Confirmed` and `kit.RefuseUnconfirmed`).
