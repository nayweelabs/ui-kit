apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-ASSETS
  title: Assets
spec:
  place:
    views:
      - structure
    group: GRP-KIT
  code:
    implements: kit.go
  contract:
    operations:
      - Assets
      - FS
      - Prefix
  caption: |
    `kit.Assets()` serves css/, fonts/, js/
    under `kit.Prefix` `/ui-kit/`, no-cache
  description: |
    Serves only files under css/, fonts/ and js/ from the embedded file system; anything else is 404. `kit.FS()` gives the same files as an fs.FS.
