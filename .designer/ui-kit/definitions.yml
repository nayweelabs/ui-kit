apiVersion: core/system/v1
kind: Definitions
metadata:
  id: definitions
spec:
  vocabulary:
    connection-label:
      - uses
      - api
      - data
      - calls
      - embeds
      - loads
      - reads
      - writes
      - http
      - module
      - release
      - related
  features:
    edges:
      label: edges
      requires:
        - Connection
      type: check
      whenUndefined: invisible
      selectors:
        traverses:
          by: connection-label
          values:
            - uses
            - api
            - data
            - calls
            - embeds
            - loads
            - reads
            - writes
            - http
            - module
            - release
        annotates:
          by: connection-label
          values:
            - related
